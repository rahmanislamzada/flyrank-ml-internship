<!-- Live Working Netlify Contact Form -->
<section id="contact" style="max-width: 600px; margin: 2rem auto; padding: 1rem;">
  <h2>Get in Touch</h2>
  <form name="contact" method="POST" data-netlify="true">
    <input type="hidden" name="form-name" value="contact" />
    
    <p>
      <label>Your Name: <br>
        <input type="text" name="name" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" />
      </label>
    </p>
    
    <p>
      <label>Your Email: <br>
        <input type="email" name="email" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" />
      </label>
    </p>
    
    <p>
      <label>Message: <br>
        <textarea name="message" rows="4" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;"></textarea>
      </label>
    </p>
    
    <p>
      <button type="submit" style="padding: 0.75rem 1.5rem; background-color: #2563EB; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Send Message
      </button>
    </p>
  </form>
</section>
